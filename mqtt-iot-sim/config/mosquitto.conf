# Mosquitto Broker Configuration for Contiki-NG IoT Simulation
# Listens on port 1883 on all interfaces (IPv4 and IPv6)
listener 1883
allow_anonymous true
persistence false

# Logging configuration
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
